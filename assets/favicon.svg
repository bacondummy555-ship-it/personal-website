<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

    <defs>

        <linearGradient id="blueGradient" x1="0" y1="0" x2="1" y2="1">

            <stop offset="0%" stop-color="#38b6ff"></stop>

            <stop offset="100%" stop-color="#006eff"></stop>

        </linearGradient>

        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">

            <feGaussianBlur stdDeviation="2" result="blur"></feGaussianBlur>

            <feMerge>

                <feMergeNode in="blur"></feMergeNode>

                <feMergeNode in="SourceGraphic"></feMergeNode>

            </feMerge>

        </filter>

    </defs>


    <!-- BACKGROUND -->

    <rect width="64" height="64" rx="14" fill="#020811"></rect>


    <!-- BORDER -->

    <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#0d6fae" stroke-width="2"></rect>


    <!-- LEFT BRACKET -->

    <path d="M19 22 L11 32 L19 42" fill="none" stroke="url(#blueGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"></path>


    <!-- J -->

    <path d="M28 21
           L28 37
           C28 42 25 45 20 45" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"></path>


    <!-- L -->

    <path d="M35 21
           L35 43
           L45 43" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>


    <!-- RIGHT BRACKET -->

    <path d="M48 22 L56 32 L48 42" fill="none" stroke="url(#blueGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"></path>

</svg>